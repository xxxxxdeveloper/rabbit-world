<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabbit World - สมุดประวัติกระต่าย</title>
    <!-- นำเข้า Supabase JavaScript Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; background: #eee; }
        .card h3 { margin: 12px 0 6px; color: #333; }
        .card p { margin: 4px 0; color: #666; font-size: 14px; }
        .badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
        .loading { text-align: center; color: #888; font-size: 16px; grid-column: 1 / -1; }
    </style>
</head>
<body>

<!-- 1. จุดสำหรับแสดงผล Nav -->
    <div id="navigation-placeholder"></div>

    <!-- เนื้อหาหลักของหน้า Index -->
    <div style="padding: 20px;">
        <h1>ยินดีต้อนรับสู่ Rabbit World 🐰</h1>
        <p>ระบบบริหารจัดการฟาร์มกระต่ายและคอมมูนิตี้</p>
    </div>

    <!-- 2. สคริปต์สำหรับดึงไฟล์ nav.html มาใส่ -->
    <script>
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navigation-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading nav:', error));
    </script>

    
    <div class="container">
        <h1>🐰 Rabbit World Profile Cards</h1>
        <div id="rabbit-list" class="card-grid">
            <div class="loading">กำลังโหลดข้อมูลจากฐานข้อมูล...</div>
        </div>
    </div>

   <script>
    // 🔑 ใส่ค่า Project URL และ Anon Public Key ของสานจาก Supabase (ดูได้จากเมนู Project Settings > API)
    const SUPABASE_URL = 'https://zuvhskifyjczghuxbkwg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_JYXD5082CWM8FKXmEWO3IQ_UQzn3Svb';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchRabbits() {
        const container = document.getElementById('rabbit-list');
        
        // ดึงข้อมูลจาก rabbit_profiles พร้อมเชื่อมโยง (Join) ตาราง users เพื่อเอาชื่อเจ้าของ
        const { data, error } = await supabaseClient
            .from('rabbit_profiles')
            .select('*, users(full_name, owner_flag)')
            .order('created_at', { ascending: false });

        if (error) {
            container.innerHTML = `<div class="loading" style="color: red;">เกิดข้อผิดพลาด: ${error.message}</div>`;
            return;
        }

        if (!data || data.length === 0) {
            container.innerHTML = '<div class="loading">ยังไม่มีข้อมูลกระต่ายในระบบ</div>';
            return;
        }

        container.innerHTML = '';
        data.forEach(rabbit => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // ตรวจสอบว่ามีข้อมูลเจ้าของผูกอยู่หรือไม่
            const ownerName = rabbit.users ? rabbit.users.full_name : 'ไม่ระบุเจ้าของ';

            card.innerHTML = `
                <img src="${rabbit.photo_url || 'https://via.placeholder.com/300x180?text=No+Image'}" alt="${rabbit.name}">
                <h3>${rabbit.name}</h3> <i class="fa-solid fa-qrcode"></i>
                <div class="badge">${rabbit.breed}</div>
                <p><strong>Microchip:</strong> ${rabbit.microchip_id}</p>
                <p><strong>เพศ:</strong> ${rabbit.gender}</p>
                <p><strong>สี/ลวดลาย:</strong> ${rabbit.color_pattern || '-'}</p>
                <p><strong>เจ้าของ:</strong> <a href="owner.html?id=${rabbit.owner_id || ''}" style="color: #0284c7; text-decoration: none;">${ownerName}</a></p>
                <p><strong>บันทึกสุขภาพ:</strong> ${rabbit.health_notes || '-'}</p>
            `;
            container.appendChild(card);
        });
    }

    fetchRabbits();
</script>
</body>
</html>
